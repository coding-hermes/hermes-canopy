# Hermes Canopy — reference production reverse proxy (nginx).
#
# THE TWO TRAPS THIS FILE EXISTS TO FIX (DF-HERMES-CANOPY-7)
#
#  1. THE SPA FALLBACK MUST EXCLUDE /api. `try_files $uri /index.html;` normally
#     catches EVERY path, so GET /api/v1/trees would be answered with index.html.
#     The client then runs `res.json()` over "<!doctype html>" and reports
#     "Unexpected token '<' ... is not valid JSON" / "Backend: unreachable".
#     Here `location /` keeps the fallback for app routes only (/trees,
#     /tree/<id>) while /api/ and /health are proxied in their own locations.
#
#  2. A STATIC BUILD CANNOT AUTHENTICATE BY ITSELF. The Vite DEV server is what
#     injects the dev JWT, and canopyd has no /api/v1/auth/* endpoints (multi-user
#     auth is deferred post-MVP). Pick ONE of:
#       (a) the client carries its own token — build the PWA with
#           VITE_API_TOKEN=<jwt>, or paste a token into
#           localStorage['canopy.token'] in the browser. NOTHING to do here.
#       (b) this proxy injects a token — see the BLOCKED-OFF block near the bottom
#           of the /api/ location. Only ever enable it BEHIND real authentication
#           (auth_request / auth_basic / an SSO gate), or you hand a live canopyd
#           credential to every anonymous caller.
#
# Install:   sudo cp deploy/nginx.canopy.conf /etc/nginx/conf.d/canopy.conf
#            sudo nginx -t && sudo systemctl reload nginx
# Then edit: server_name, the TLS cert paths, and `root` below. NOTE: the docs'
# old `:3000` example is not a reserved port — `listen` here is whatever you put
# it on, and deploy/reference-proxy.py refuses to start on a busy port.

# ─── `/api` + `/health`: reverse-proxied, streamed, never the SPA fallback ────
upstream canopy_api {
    # canopyd's listen address (`HTTP_ADDR`; make run / compose use :8091, the
    # raw binary defaults to :8080).
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name canopy.example.com;

    ssl_certificate     /etc/letsencrypt/live/canopy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopy.example.com/privkey.pem;

    # The built PWA. `cd frontend && npm run build` → frontend/dist
    # (VERIFY the path: it is NOT frontend/frontend/dist).
    root /srv/canopy/frontend/dist;
    index index.html;

    # Hashed bundles can be cached hard; index.html and the service worker must
    # not be, or a deploy never reaches the browser.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # ── Trap 1 lives here ───────────────────────────────────────────────────
    # App routes only: unknown paths fall back to the SPA shell, which is why
    # deep links like /tree/<id> work on a hard refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── /api/* : SSE-safe relay to canopyd ──────────────────────────────────
    location /api/ {
        proxy_pass http://canopy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AUTHORIZATION PASS-THROUGH (default nginx behaviour, stated explicitly
        # so nobody "helpfully" blanks it). The client's own bearer token — from
        # VITE_API_TOKEN or localStorage['canopy.token'] — reaches canopyd as-is.
        proxy_set_header Authorization $http_authorization;

        # SSE: nothing may buffer the stream. `proxy_buffering off` flushes each
        # upstream chunk straight to the browser; the long read timeout keeps
        # event streams from being cut while idle.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";

        # ── OPTION (b): proxy-injected token — ONLY behind authentication ──
        # Uncomment the auth gate FIRST (or the token leaks to anonymous
        # callers); deploy/reference-proxy.py enforces the same rule and refuses
        # to start without it.
        #
        #   auth_request /authz;                 # or: auth_basic "Canopy";
        #                                        #     auth_basic_user_file /etc/nginx/.htpasswd;
        #   proxy_set_header Authorization "Bearer <JWT>";
        #
        # The JWT must be minted out-of-band: there is no login endpoint.
    }

    # `/health` is public on canopyd and drives the PWA's connectivity banner.
    # It must also never fall through to index.html (the client parses it too).
    location = /health {
        proxy_pass http://canopy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# Optional: send plain HTTP to HTTPS.
server {
    listen 80;
    server_name canopy.example.com;
    return 301 https://$host$request_uri;
}
