- id: TEST-002-sweep
  title: 'TEST-002 long-term fix: pre-run stale-DB sweep in NewIntegrationPool'
  criteria:
  - NewIntegrationPool (internal/testutil/integration.go) runs a sweep on startup that drops stale canopy_*
    test databases older than 1 hour
  - Sweep connects via the admin URL (CANOPY_ADMIN_DB_URL, default postgres://canopy:canopy@localhost:5437/postgres)
    and only touches databases matching the canopy_% prefix
  - "Age detection is conservative: active/young databases (used by concurrent test packages) are never\
    \ dropped \u2014 only DBs with no active connections and creation time older than 1h"
  - Sweep failure is non-fatal (logged/ignored) so a locked DB never blocks test setup
  - Existing testutil tests pass; go build + go vet + gofmt clean; no unrelated changes
  - 'Sweep verified live: after running the test suite, leftover canopy_* count stays near 0 (no new leaks
    accumulate within a single run)'
  status: complete
  created_at: '2026-07-31T22:01:29.604747+00:00'
  completed_at: '2026-07-31T22:38:57.770468+00:00'
