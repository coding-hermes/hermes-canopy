# GitLab CI Pipeline — Hermes Canopy (gitlab.readydedis.com, local CI server)
# Go backend (canopyd) + React/Vite frontend. Triggers on: push to master,
# merge requests, tags.

stages:
  - build
  - test
  - lint

variables:
  GO_VERSION: "1.25"
  GOPATH: $CI_PROJECT_DIR/.go
  GOMODCACHE: $CI_PROJECT_DIR/.go/pkg/mod
  NODE_VERSION: "22"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/
    - frontend/.npm/

default:
  interruptible: true

.fe-setup: &fe-setup
  image: node:${NODE_VERSION}
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

# ── Backend build ────────────────────────────────────────────────────
backend-build:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    - go build ./...
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Frontend build (tsc -b + vite + service worker) ─────────────────
frontend-build:
  stage: build
  <<: *fe-setup
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Backend tests (Debian image: -race needs cgo) ───────────────────
backend-test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test ./... -race -count=1 -short
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Frontend tests (vitest) ──────────────────────────────────────────
frontend-test:
  stage: test
  <<: *fe-setup
  script:
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Frontend lint (oxlint, blocking) ────────────────────────────────
frontend-lint:
  stage: lint
  <<: *fe-setup
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# ── Backend lint (informational, non-blocking) ──────────────────────
backend-lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2-alpine
  allow_failure: true
  script:
    - golangci-lint run ./...
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
