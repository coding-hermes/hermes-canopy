name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.25"]

    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready -U canopy
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -o /dev/null ./cmd/canopyd

      - name: Vet
        run: go vet ./...

      - name: Test (short)
        run: go test ./... -short -count=1 -timeout=60s

      - name: Integration tests
        run: go test ./... -count=1 -run 'TestIntegration' -timeout=180s
        env:
          CANOPY_TEST_DB_URL: postgres://canopy:canopy@localhost:5437/canopy?sslmode=disable
