name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.25"]

    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U canopy"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ── Go toolchain ──────────────────────────────────────────

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -o /dev/null ./cmd/canopyd

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=2m

      - name: Test (short)
        run: go test ./... -short -count=1 -timeout=60s

      - name: Integration tests
        run: go test ./... -count=1 -run 'TestIntegration' -timeout=180s
        env:
          CANOPY_TEST_DB_URL: postgres://canopy:canopy@localhost:5437/canopy?sslmode=disable

      # ── Frontend ──────────────────────────────────────────────

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, build, type-check
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx tsc --noEmit

      # ── Gitleaks secrets scan ─────────────────────────────────

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_amd64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks detect
        run: gitleaks detect --no-git -v -c .gitleaks.toml

      # ── Docker image build ────────────────────────────────────

      - name: Docker build
        run: docker build -t canopyd -f deploy/Dockerfile .

      # ── Deploy (informational, no-op) ─────────────────────────

      - name: Deploy
        if: always()
        run: echo "deploy skipped for PR — requires merge to master"
