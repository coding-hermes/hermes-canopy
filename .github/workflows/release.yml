# FTR-06 Phase 1 + Phase 3 (build/publish mechanics) — SPEC-FTR-06
# Native binary release workflow: cross-build canopyd via Makefile targets,
# generate sha256 checksums, upload artifacts to a GitHub Release.
# Triggered on v* tags (and manual dispatch for re-runs).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-manifest-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build all cross targets
        run: |
          make build-embed-linux-amd64
          make build-embed-linux-arm64
          make build-embed-darwin-amd64
          make build-embed-darwin-arm64
          make build-embed-windows-amd64

      - name: Generate checksums
        run: |
          cd bin
          for f in canopyd_linux_amd64 canopyd_linux_arm64 canopyd_darwin_amd64 canopyd_darwin_arm64 canopyd_windows_amd64.exe; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Package Linux installers
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          nfpm package --config deploy/nfpm.yaml --packager deb --target "dist/canopy_${VERSION}_amd64.deb"
          nfpm package --config deploy/nfpm.yaml --packager rpm --target "dist/canopy-${VERSION}-1.x86_64.rpm"

      - name: Generate signed release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is required; refusing to publish unsigned latest.json"
            exit 1
          fi
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp bin/canopyd* release-assets/
          cp dist/*.deb dist/*.rpm release-assets/
          go run ./cmd/release-tool \
            --artifacts release-assets \
            --manifest dist/latest.json \
            --version "$VERSION" \
            --channel stable \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Validate release manifest publication contract
        run: make validate-release-manifest-publication

      - name: Publish signed manifest to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=stable
          pages_dir="${RUNNER_TEMP}/canopy-pages"
          rm -rf "$pages_dir"

          # Keep the publication branch independent from the tag checkout. The
          # first release creates it; later releases update the existing tree.
          if git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"; then
            git worktree add --detach "$pages_dir" origin/gh-pages
          else
            git init "$pages_dir"
            git -C "$pages_dir" checkout --orphan gh-pages
          fi
          git -C "$pages_dir" config user.name "github-actions[bot]"
          git -C "$pages_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages_dir" remote remove origin 2>/dev/null || true
          git -C "$pages_dir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mkdir -p "$pages_dir/$channel"
          cp -- dist/latest.json "$pages_dir/$channel/latest.json"
          # Never publish a re-encoded or regenerated manifest.
          cmp --silent dist/latest.json "$pages_dir/$channel/latest.json"
          printf '%s\n' 'releases.canopy.app' > "$pages_dir/CNAME"
          git -C "$pages_dir" add -- "$channel/latest.json" CNAME
          if git -C "$pages_dir" diff --cached --quiet; then
            echo "GitHub Pages already contains the signed $channel manifest"
          else
            git -C "$pages_dir" commit -m "chore: publish $channel manifest for ${GITHUB_REF_NAME}"
          fi
          git -C "$pages_dir" push origin HEAD:gh-pages

      # macOS and Windows code signing are intentionally deferred until the
      # owner supplies platform signing credentials and runner-specific jobs.
      # This workflow makes no claim that the five cross-built binaries are signed.

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "$(git describe --tags --abbrev=0)^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log --oneline "$PREV..${GITHUB_REF_NAME}" > release-notes.txt || true
          else
            git log --oneline > release-notes.txt || true
          fi
          { echo "## Changes"; echo '```'; cat release-notes.txt; echo '```'; } > body.md

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: body.md
          files: |
            bin/canopyd_linux_amd64
            bin/canopyd_linux_amd64.sha256
            bin/canopyd_linux_arm64
            bin/canopyd_linux_arm64.sha256
            bin/canopyd_darwin_amd64
            bin/canopyd_darwin_amd64.sha256
            bin/canopyd_darwin_arm64
            bin/canopyd_darwin_arm64.sha256
            bin/canopyd_windows_amd64.exe
            bin/canopyd_windows_amd64.exe.sha256
            dist/canopy_*.deb
            dist/canopy-*.rpm
            dist/latest.json
