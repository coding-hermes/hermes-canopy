version: "2"

run:
  timeout: 60s
  tests: false

errcheck:
  check-type-assertions: true

staticcheck:
  checks: ["all"]

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  use-default-exclusions: false

output:
  formats:
    colored-line-number: {}
