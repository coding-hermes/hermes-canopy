# Canopy — Production deployment
# Start: docker compose -f docker-compose.yml up -d
# Multi-stage deploy/Dockerfile builds the frontend release artifact (frontend/dist)
# alongside the canopyd API binary; canopyd is API-only in MVP — serve the PWA
# separately (e.g. a static file server in front of the API host).

services:
  postgres:
    image: postgres:16-alpine
    container_name: canopy-pg
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: canopy
      POSTGRES_DB: canopy
    ports:
      - "${CANOPY_PG_HOST_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - canopy-net
    # GAP-099: without a restart policy the daemon came back at boot but this
    # container did NOT (exited 255, RestartPolicy=no) — the 2026-09-21 reboots
    # left the graph DB dead and canopy-canopyd crash-looping against it for
    # 6h+. The host systemd unit carries the same net (ExecStartPre).
    restart: unless-stopped

  canopyd:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      # Build identity (R14-03 / GAP-100): pass the same version/commit/build
      # timestamp `make build` stamps. Override via env (compose reads .env):
      #   CANOPY_COMMIT=$(git rev-parse --short=8 HEAD) \
      #   CANOPY_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose build canopyd
      # `make docker` passes all three computed values directly. Defaults match
      # the Makefile's fallbacks (dev / unknown).
      args:
        CANOPY_VERSION: ${CANOPY_VERSION:-dev}
        CANOPY_COMMIT: ${CANOPY_COMMIT:-unknown}
        CANOPY_BUILD_TIME: ${CANOPY_BUILD_TIME:-unknown}
    container_name: canopy-server
    ports:
      # :8092 on the host — :8091 is reserved for the host systemd
      # canopy-canopyd.service (primary instance). Compose stack is the
      # containerized alternative (GAP-063).
      - "8092:8080"
    healthcheck:
      # QA-HERMES-CANOPY-40 readiness gate: a canopyd that crash-loops (bad DB
      # auth) or never binds its listener still shows the container "Started"
      # while the published host port answers nothing. Gate readiness on the
      # public GET /health endpoint canopyd serves on HTTP_ADDR — which the
      # environment block below pins to :8080, the container side of the
      # 8092:8080 publish (compose `environment` overrides env_file, so a
      # user .env cannot move the listener out from under this probe).
      # wget is busybox's — the alpine runtime image ships no curl. 20
      # consecutive failures at a 3s interval mark the service unhealthy
      # after ~60s, so `docker compose up -d --wait` exits non-zero and
      # `docker compose ps` shows unhealthy instead of a silently dead
      # publish.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      HTTP_ADDR: ":8080"
      # The password must match POSTGRES_PASSWORD on the postgres service
      # above (canopy). A placeholder here makes canopyd fail DB auth and
      # exit inside 60s of boot — the exact "Started but :8092 unreachable"
      # symptom this readiness gate exists to surface loudly.
      CANOPY_DB_URL: postgres://canopy:canopy@postgres:5432/canopy?sslmode=disable
      CANOPY_DEV: "false"
      METRICS_ENABLED: "true"
      # Hermes gateway (GAP-050): the api_server listens on the HOST loopback,
      # so the container must reach it via host-gateway — never 127.0.0.1.
      HERMES_WEBUI_GATEWAY_BASE_URL: "http://host.docker.internal:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - canopy-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  canopy-net:
    driver: bridge
